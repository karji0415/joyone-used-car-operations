<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>JOYone 智能助手 · 演示</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#18334a;background:#f4f8fb;font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,a{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}header{height:76px;background:white;border-bottom:1px solid #e1e9ef;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;gap:16px}a{color:#176988;text-decoration:none}.brand{font-size:22px;font-weight:700;letter-spacing:-1px}.badge{font-size:12px;border:1px solid #d6e7ef;color:#47738b;border-radius:20px;padding:4px 10px;background:#f1f8fc}.layout{max-width:1180px;margin:38px auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;padding:0 24px}aside h1{font-size:30px;line-height:1.25;margin:8px 0 14px;font-family:Georgia,"Songti SC",serif;font-weight:500}aside p{color:#668093;font-size:14px}.tasks{display:grid;gap:10px;margin-top:26px}.task{background:white;border:1px solid #dbe6ec;text-align:left;border-radius:12px;padding:15px;color:#18334a}.task:hover,.task:focus-visible{border-color:#087fba;background:#edf8fe}.task strong,.task span{display:block}.task span{font-size:12px;color:#688395;margin-top:5px}.chat{background:white;border:1px solid #dfe9ef;border-radius:20px;overflow:hidden;box-shadow:0 12px 38px #18334a06}.chat-head{padding:20px 24px;border-bottom:1px solid #e8eef2;display:flex;align-items:center;gap:12px}.avatar{width:38px;height:38px;border-radius:12px;background:#e2f4ff;color:#087fba;display:grid;place-items:center;font-weight:700}.chat-head strong{display:block}.chat-head small{color:#718795}#messages{min-height:330px;max-height:58vh;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:18px}.message{padding:17px 20px;max-width:94%;border-radius:4px 15px 15px;background:#f3f7fa;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{align-self:flex-end;background:#e1f2fc;border-radius:15px 4px 15px 15px}.decision{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.decision button{padding:8px 14px;border:1px solid #b4cedc;border-radius:8px;color:#176988;background:white}.decision button:disabled{opacity:.6;cursor:default}form{border-top:1px solid #e8eef2;display:flex;gap:10px;padding:18px 24px}input{min-width:0;flex:1;border:1px solid #d5e1e9;border-radius:10px;padding:12px;font-size:16px;outline-color:#087fba}form button{border:0;border-radius:10px;padding:10px 19px;background:#087fba;color:white}.foot{font-size:12px;color:#78909f;margin:0;padding:0 24px 18px}.reset{border:0;background:transparent;color:#637f90;margin-left:auto}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:680px){header{height:66px;padding:0 18px}.layout{margin:22px auto;padding:0 14px;grid-template-columns:minmax(0,1fr);gap:18px}aside h1{font-size:26px;margin:0}aside p{margin:6px 0}.tasks{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:16px}.task{padding:11px 8px;font-size:13px}.task span{display:none}.chat-head{padding:16px}#messages{padding:16px;min-height:270px;max-height:48vh}.message{max-width:100%;padding:14px;font-size:14px}form{padding:14px;gap:7px}form button{padding:10px 14px}.foot{padding:0 14px 14px}.badge{font-size:11px}.chat{border-radius:15px}}
</style>
</head>
<body>
<header><a class="brand" href="index.html?agent=demo">JOYone</a><span class="badge">演示 · 示例数据</span><a href="index.html?agent=demo">返回工作台</a></header>
<main class="layout"><aside><h1>你的业务，<br>从一句话开始。</h1><p>选择一项任务，体验助手协作。</p><div class="tasks"><button class="task" data-task="sheet"><strong>表格核查</strong><span>查看差异与人工确认</span></button><button class="task" data-task="vehicle"><strong>车辆进度</strong><span>查询材料与下一步</span></button><button class="task" data-task="mail"><strong>通知草稿</strong><span>生成内容并人工审阅</span></button></div></aside>
<section class="chat" aria-label="智能助手演示"><div class="chat-head"><span class="avatar">J</span><div><strong>智能助手</strong><small>业务协作体验</small></div><button class="reset" id="reset" type="button">重置</button></div><div id="messages" role="log" aria-live="polite"></div><form id="composer"><label class="sr" for="prompt">输入演示任务</label><input id="prompt" placeholder="试试：核查表格、查询车辆、生成通知" autocomplete="off" maxlength="300"><button type="submit">发送</button></form><p class="foot">预设回复演示，不调用真实服务。请勿输入业务或个人敏感信息。</p></section></main>
<script>
if(new URLSearchParams(location.search).has('embed')){document.querySelector('header').hidden=true;document.querySelector('aside').hidden=true;document.querySelector('.layout').style.cssText='display:block;margin:0;padding:0';}
const messages=document.getElementById('messages');
const prompts={sheet:'帮我核查这份表格。',vehicle:'查看车辆 DEMO-001 的进度。',mail:'为材料缺项生成通知草稿。'};
const replies={sheet:'示例核查已完成\n\n处理对象：销售台账示例，共 12 条记录。\n• 1 处字段变化：DEMO-001，金额由 128,000 变为 126,000。\n• 1 处缺项：DEMO-002，交接日期为空。\n• 1 处匹配待确认：尾号对应两条候选记录。\n\n依据：示例原表与示例补充表逐项比较。\n建议：确认金额变化，补齐日期；候选不唯一时人工选择。',vehicle:'车辆 DEMO-001 · 示例进度\n\n已完成：车辆入库、基础信息核对。\n待补齐：交接确认材料。\n当前状态：等待反馈。\n\n依据：示例车辆任务记录。\n下一步：联系材料负责人；收到材料后人工复核。',mail:'通知草稿 · 示例\n\n主题：请补充车辆交接确认材料\n\n您好，\n车辆 DEMO-001 的交接确认材料尚未齐全，请核对并补充。收到后我们将进行复核，并更新处理进度。\n\n感谢配合。\n\n发送前请核对收件人、车辆信息及附件。'};
function bubble(text,user=false){const node=document.createElement('div');node.className='message'+(user?' user':'');node.textContent=text;messages.append(node);messages.scrollTop=messages.scrollHeight;return node;}
function run(task,text){bubble(text||prompts[task],true);if(!task){bubble('这个演示提供三项预设任务：表格核查、车辆进度和通知草稿。请点击左侧或上方的任务开始。');return;}const node=bubble(replies[task]);const actions=document.createElement('div');actions.className='decision';const confirm=document.createElement('button');confirm.type='button';confirm.textContent=task==='sheet'?'模拟确认金额变化':task==='vehicle'?'模拟创建跟进':'模拟确认草稿';const back=document.createElement('button');back.type='button';back.textContent='退回修改';function decide(accepted){confirm.disabled=back.disabled=true;bubble(accepted?(task==='sheet'?'已模拟记录金额确认。日期缺项和匹配不确定项仍待处理。未修改任何文件。':task==='vehicle'?'已模拟创建材料跟进，状态为等待反馈。未通知任何人员。':'已模拟标记草稿为已审阅。未发送邮件。'):'已模拟退回，等待补充信息后重新核查。');}confirm.onclick=()=>decide(true);back.onclick=()=>decide(false);actions.append(confirm,back);node.append(actions);messages.scrollTop=messages.scrollHeight;}
function reset(){messages.replaceChildren();document.getElementById('prompt').value='';bubble('你好，我是你的智能助手。\n请选择一项示例任务，体验从核查、建议到人工确认的过程。');}
document.querySelectorAll('[data-task]').forEach(button=>button.onclick=()=>run(button.dataset.task));document.getElementById('reset').onclick=reset;document.getElementById('composer').onsubmit=event=>{event.preventDefault();const input=document.getElementById('prompt');const text=input.value.trim();if(!text)return;input.value='';const task=/邮件|通知|草稿/.test(text)?'mail':/表格|核查|差异/.test(text)?'sheet':/车辆|进度|材料/.test(text)?'vehicle':null;run(task,text);};reset();
</script>
</body></html>
